services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_local_only}
      POSTGRES_DB: nexus
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus_local_only}@db:5432/nexus?schema=public
      APP_ORIGIN: http://localhost:3000
      PORT: 3000
      NODE_ENV: development
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "npm run db:migrate && npm run db:seed && npm start"
volumes:
  postgres_data:
